<mat-card class="login-card">

  <mat-card-header>
    <mat-card-title>Área administrativa</mat-card-title>
  </mat-card-header>

  <mat-card-content>

    <form [formGroup]="form" (ngSubmit)="entrar()">

      <mat-form-field appearance="outline">
        <mat-label>Usuário</mat-label>

        <input
          matInput
          id="usuario"
          type="text"
          formControlName="usuario"
          autocomplete="username"
        >

        @if (
          form.controls.usuario.touched &&
          form.controls.usuario.invalid
        ) {
          <mat-error>
            Informe o usuário.
          </mat-error>
        }

      </mat-form-field>


      <mat-form-field appearance="outline">
        <mat-label>Senha</mat-label>

        <input
          matInput
          id="senha"
          type="password"
          formControlName="senha"
          autocomplete="current-password"
        >

        @if (
          form.controls.senha.touched &&
          form.controls.senha.invalid
        ) {
          <mat-error>
            Informe a senha.
          </mat-error>
        }

      </mat-form-field>


      @if (erro) {
        <p class="erro">{{ erro }}</p>
      }


      <button
        mat-raised-button
        color="primary"
        type="submit"
        [disabled]="entrando"
      >
        {{ entrando ? 'Entrando...' : 'Entrar' }}
      </button>

    </form>

  </mat-card-content>

</mat-card>
