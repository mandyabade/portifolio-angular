<mat-sidenav-container class="container">

  <mat-sidenav opened mode="side" class="sidenav">

    <div class="logo">
      <h2>Portfólio</h2>
    </div>

    <mat-nav-list>
      <a mat-list-item routerLink="/" routerLinkActive="ativo" [routerLinkActiveOptions]="{ exact: true }">
        Início
      </a>

      <a mat-list-item routerLink="/sobre" routerLinkActive="ativo">
        Sobre
      </a>

      <a mat-list-item routerLink="/projetos" routerLinkActive="ativo">
        Projetos
      </a>

      <a mat-list-item routerLink="/contato" routerLinkActive="ativo">
        Contato
      </a>

      <a mat-list-item routerLink="/catalogo" routerLinkActive="ativo">
        Catálogo
      </a>

      <a mat-list-item routerLink="/gestao" routerLinkActive="ativo">
        Gestão
      </a>

    </mat-nav-list>

  </mat-sidenav>

  <mat-sidenav-content>

    <mat-toolbar color="primary">

      <span class="titulo">
        Meu Portfólio
      </span>

      <span class="espacador"></span>

      <a mat-button routerLink="/" routerLinkActive="ativo" [routerLinkActiveOptions]="{ exact: true }">
        Início
      </a>

      <a mat-button routerLink="/sobre" routerLinkActive="ativo">
        Sobre
      </a>

      <a mat-button routerLink="/projetos" routerLinkActive="ativo">
        Projetos
      </a>

      <a mat-button routerLink="/contato" routerLinkActive="ativo">
        Contato
      </a>

      <a mat-button routerLink="/catalogo" routerLinkActive="ativo">
        Catálogo
      </a>

      <a mat-button routerLink="/gestao" routerLinkActive="ativo">
        Gestão
      </a>

    </mat-toolbar>

    <main class="conteudo">
      <router-outlet></router-outlet>
    </main>

  </mat-sidenav-content>

</mat-sidenav-container>
